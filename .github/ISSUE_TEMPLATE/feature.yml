name: Feature request
description: Propose a parser, workflow improvement, or bounded analysis feature.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What controlled before/after workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the useful report result, not only an implementation.
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Input family
      options:
        - Unknown binary
        - Structured text
        - SQLite
        - Archive or container
        - Snapshot workflow
        - Reporting
        - Other
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Safety and work limits
      description: Note expected file sizes, entry counts, or sensitive-data concerns.
